name: Build Whisper runtime artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-22.04
    steps:
      - name: Download whisper.cpp Linux binary
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 \
            -o whisper-bin.tar.gz \
            https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-bin-ubuntu-x64.tar.gz
          mkdir -p runtime
          tar -xzf whisper-bin.tar.gz -C runtime
          find runtime -maxdepth 3 -type f -print

      - name: Download multilingual base Q5_1 model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 \
            -o runtime/ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          test -s runtime/ggml-base-q5_1.bin
          sha256sum runtime/ggml-base-q5_1.bin

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: whisper-runtime-linux-x64-base-q5_1
          path: runtime/
          retention-days: 1
          if-no-files-found: error
